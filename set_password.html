<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Your Password — STRPark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#C1615B; --coral-dark:#9C4A45;
    --gray-ink:#2B2B2B; --gray-mid:#6E6E6E; --gray-line:#DEDAD5; --bg:#F4F5F7; --surface:#FFFFFF;
    --ok:#2F7A4F; --ok-bg:#E4F3E8; --bad:#B23B3B; --bad-bg:#FAE6E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Libre Franklin',sans-serif;background:var(--bg);color:var(--gray-ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:440px;margin:0 auto;padding:48px 16px 60px;}
  .brand{font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--coral-dark);text-align:center;margin-bottom:16px;}
  .card{background:var(--surface);border:1px solid var(--gray-line);border-top:3px solid var(--coral);border-radius:12px;padding:26px;}
  h1{margin:0 0 6px;font-size:21px;font-weight:800;}
  .sub{font-size:13.5px;color:var(--gray-mid);line-height:1.5;margin:0 0 18px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-mid);font-weight:600;}
  .field input{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--gray-line);border-radius:6px;width:100%;}
  .field input:focus{outline:2px solid var(--coral);outline-offset:1px;}
  .btn{width:100%;background:var(--coral);border:none;color:#fff;padding:13px 16px;border-radius:8px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px;}
  .btn:hover{background:var(--coral-dark);}
  .btn:disabled{background:var(--gray-line);cursor:not-allowed;}
  .msg{border-radius:6px;padding:12px 14px;font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:14px;display:none;}
  .msg.ok{background:var(--ok-bg);color:var(--ok);}
  .msg.bad{background:var(--bad-bg);color:var(--bad);}
  .links{text-align:center;margin-top:16px;font-size:13px;}
  .links a{color:var(--coral-dark);}
  .note{font-size:12px;color:var(--gray-mid);text-align:center;margin-top:14px;line-height:1.5;}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  @media (max-width: 640px){
    .wrap{padding:24px 12px 40px;}
    .card{padding:20px 16px;}
    .field input{font-size:16px;}   /* stops iPhone zooming in on tap */
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">STRPark</div>
  <div class="card">
    <h1 id="title">Loading&hellip;</h1>
    <p class="sub" id="sub"></p>
    <div class="msg" id="msg"></div>

    <div id="passwordForm" style="display:none;">
      <div class="field"><label for="pw1">New password</label><input type="password" id="pw1" autocomplete="new-password" placeholder="At least 8 characters"></div>
      <div class="field"><label for="pw2">Confirm password</label><input type="password" id="pw2" autocomplete="new-password" onkeydown="if(event.key==='Enter')savePassword()"></div>
      <button class="btn" id="saveBtn" onclick="savePassword()">Save password</button>
    </div>

    <div id="forgotForm" style="display:none;">
      <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')sendReset()"></div>
      <button class="btn" id="sendBtn" onclick="sendReset()">Email me a reset link</button>
    </div>

    <div id="doneBox" style="display:none;">
      <a class="btn" id="goBtn" style="display:block;text-align:center;text-decoration:none;" href="#">Continue</a>
    </div>
  </div>
  <div class="links" id="links"></div>
  <p class="note">Simulated email: until STRPark is connected to a real email service, emails appear in the Global Admin's Outbox.</p>
</div>

<script>
const API_BASE = 'https://api-staging.strpark.com';
const params = new URLSearchParams(location.search);
const token = params.get('token');
const verifyToken = params.get('verify');
const back = /^[a-z_]+\.html$/.test(params.get('back') || '') ? params.get('back') : null;
let linkInfo = null;

function localDateISO(d = new Date()){
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
async function api(method, path, body, auth){
  const opts = {method, headers: {'Content-Type': 'application/json', 'X-Client-Date': localDateISO(),
                                  'X-App-Base': new URL('.', location.href).href}};
  if(auth) opts.headers['Authorization'] = 'Bearer ' + auth;
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  const json = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(json.error || `Request failed (${res.status})`);
  return json;
}
const $ = id => document.getElementById(id);
function show(id, on = true){ $(id).style.display = on ? 'block' : 'none'; }
function msg(text, ok){ const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.style.display = 'block'; }
function setHead(title, sub){ $('title').textContent = title; $('sub').innerHTML = sub || ''; }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setLinks(){
  const where = back || 'admin_portal.html';
  $('links').innerHTML = `<a href="${where}">Back to sign in</a>`;
}

const PORTAL_FOR_ROLE = {
  global_admin: 'admin_portal.html', company_admin: 'admin_portal.html', location_admin: 'admin_portal.html',
  instance_admin: 'admin_portal.html', owner: 'owner_portal.html', agency_admin: 'agency_portal.html',
  agency_agent: 'agency_portal.html', enforcement_admin: 'enforcement_portal.html', patrol: 'enforcement_portal.html',
};
async function portalFor(user, auth){
  if(user.role === 'company_admin' && user.company_id){
    try{
      const co = await api('GET', `/companies/${user.company_id}`, null, auth);
      if(co.edition === 'community') return 'community_portal.html';
    }catch(e){}
  }
  return PORTAL_FOR_ROLE[user.role] || 'admin_portal.html';
}

async function initPasswordLink(){
  try{
    linkInfo = await api('GET', `/auth/account-link?token=${encodeURIComponent(token)}`);
  }catch(e){
    setHead("This link can't be used", '');
    msg(e.message, false);
    $('links').innerHTML = `<a href="set_password.html?forgot=1${back ? '&back=' + back : ''}">Get a new link</a>`;
    return;
  }
  if(linkInfo.purpose === 'verify'){ location.replace(`set_password.html?verify=${encodeURIComponent(token)}`); return; }
  if(linkInfo.purpose === 'invite'){
    setHead(`Welcome to STRPark${linkInfo.name ? ', ' + linkInfo.name.split(' ')[0] : ''}`,
      `Choose a password for <b>${esc(linkInfo.email)}</b>. You'll use it with this email to sign in.`);
  } else {
    setHead('Choose a new password', `For <b>${esc(linkInfo.email)}</b>. This link works once.`);
  }
  show('passwordForm');
  $('pw1').focus();
}

async function savePassword(){
  const p1 = $('pw1').value, p2 = $('pw2').value;
  if(p1.length < 8) return msg('Password must be at least 8 characters.', false);
  if(p1 !== p2) return msg("The two passwords don't match.", false);
  $('saveBtn').disabled = true;
  try{
    const r = await api('POST', '/auth/set-password', {token, password: p1});
    try{ localStorage.setItem('strpark_token', r.token); }catch(e){}
    show('passwordForm', false);
    const portal = await portalFor(r.user, r.token);
    setHead('Password saved', `You can now sign in as <b>${esc(r.user.email)}</b>.`);
    msg("You're all set.", true);
    $('goBtn').href = portal;
    $('goBtn').textContent = 'Continue to STRPark';
    show('doneBox');
    history.replaceState(null, '', 'set_password.html');   // the link is spent; don't leave it in the address bar
  }catch(e){
    msg(e.message, false);
    $('saveBtn').disabled = false;
  }
}

async function initVerify(){
  setHead('Confirming your email…', '');
  try{
    const r = await api('POST', '/auth/verify-email', {token: verifyToken});
    setHead('Email confirmed', `Thanks. <b>${esc(r.email)}</b> is confirmed, so your community keeps issuing permits.`);
    $('goBtn').href = 'community_portal.html';
    $('goBtn').textContent = 'Go to your Community Portal';
    show('doneBox');
    history.replaceState(null, '', 'set_password.html');
  }catch(e){
    setHead("This link can't be used", '');
    msg(e.message + ' You can send a new one from Settings in your Community Portal.', false);
    $('links').innerHTML = '<a href="community_portal.html">Community Portal</a>';
  }
}

function initForgot(){
  setHead('Forgot your password?', "Enter the email you sign in with. We'll email you a link to choose a new password.");
  show('forgotForm');
  setLinks();
  $('email').focus();
}

async function sendReset(){
  const email = $('email').value.trim();
  if(!email) return msg('Please enter your email.', false);
  $('sendBtn').disabled = true;
  try{
    const r = await api('POST', '/auth/forgot-password', {email});
    show('forgotForm', false);
    setHead('Check your email', '');
    msg(r.message, true);
  }catch(e){
    msg(e.message, false);
    $('sendBtn').disabled = false;
  }
}

if(verifyToken) initVerify();
else if(token) initPasswordLink();
else initForgot();
</script>
</body>
</html>
